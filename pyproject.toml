[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hinglish-sentiment-research"
version = "0.1.0"
description = "Reproducible sentiment classification experiments inspired by arXiv:2601.05091"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "scikit-learn>=1.5,<1.8", "matplotlib>=3.8,<3.11",
  "joblib>=1.4,<2", "emoji>=2.12,<3", "transformers==4.57.1", "torch>=2.6,<2.8",
]

[project.scripts]
sentiment-research = "sentiment_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
